<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clash Proxy 管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Clash Proxy 管理面板</h1>
    </header>

    <section class="card">
      <h2>状态</h2>
      <div id="status" class="status-grid">加载中...</div>
      <button id="btn-refresh-status" class="btn">刷新状态</button>
    </section>

    <section class="card">
      <h2>本地 YAML 配置</h2>
      <p id="yaml-active" class="selection-summary" role="status">正在读取 YAML 应用记录…</p>
      <div id="configs-list"></div>
      <div class="yaml-form">
        <label for="yaml-file">选择 YAML 文件</label>
        <input id="yaml-file" type="file" accept=".yaml,.yml" />
        <details>
          <summary>粘贴 YAML</summary>
          <textarea id="yaml-paste" rows="8" aria-label="粘贴 YAML" placeholder="粘贴完整的 Clash/Mihomo YAML"></textarea>
        </details>
        <label for="yaml-name">保存文件名</label>
        <input id="yaml-name" type="text" value="pasted.yaml" />
      </div>
      <div class="actions">
        <button id="btn-import-paste" class="btn primary">保存并推送到 Clash</button>
        <button id="btn-import-save-only" class="btn">仅保存</button>
        <button id="btn-refresh-configs" class="btn">刷新配置列表</button>
      </div>
      <div id="config-message" class="message" role="status"></div>
    </section>

    <section class="card">
      <h2>策略组与节点选择</h2>
      <p id="route-overview" class="selection-summary" role="status">正在读取转发线路…</p>
      <div class="group-tools">
        <input id="group-filter" type="search" aria-label="筛选策略组或已选节点" placeholder="筛选策略组或已选节点" />
        <button id="btn-refresh-proxies" class="btn">刷新节点列表</button>
      </div>
      <div id="groups">加载中...</div>
      <p id="no-matching-groups" class="muted" hidden>没有匹配的策略组。</p>
      <div id="node-message" class="message" role="status"></div>
    </section>

    <details class="card">
      <summary class="section-title">链接订阅</summary>
      <p id="applied-config" class="applied-config" role="status">正在读取应用记录…</p>
      <div class="sub-form">
        <input id="sub-url" type="url" aria-label="订阅链接" placeholder="输入 Clash/Mihomo 订阅链接" />
        <button id="btn-add-sub" class="btn primary">添加订阅</button>
      </div>
      <div id="subs-list"></div>
      <div class="actions">
        <button id="btn-update-subs" class="btn">更新订阅缓存</button>
        <button id="btn-refresh-subs" class="btn">刷新列表</button>
      </div>
      <div id="sub-message" class="message" role="status"></div>
    </details>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
